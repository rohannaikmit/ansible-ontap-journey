---
- name: NAS share provision
  hosts: localhost
  gather_facts: false
  
  collections:
    - netapp.ontap

  module_defaults:
    group/netapp.ontap.netapp_ontap:
      hostname: "{{ na_hostname }}"
      username: "{{ na_username }}"
      password: "{{ na_password }}"
      https: true
      vserver: "{{ vserver }}"
      validate_certs: false
      use_rest: auto

  
  vars_files:
   - ./nas_vars.yml

  vars_prompt:
    - name: "na_password"
      prompt: "Enter_password"
      private: true
      confirm: false
  
  tasks:
    - name: Create Export policy
      na_ontap_export_policy:
        state: present
        name: "{{ policy_name }}_policy"
        
      when: protocol.lower() == 'nfs'

    - name: Creat Export policy rules
      na_ontap_export_policy_rule:
        state: present
        name: "{{ policy_name }}_policy"
        client_match: "{{ clientmatch }}"
        rule_index: 5
        
        ro_rule: sys
        rw_rule: sys
        protocol: nfs
      when: protocol.lower() == 'nfs'

    - name: Create volume
      na_ontap_volume:
        name: "{{ item }}"
        state: present
        size: "{{ size }}"
        size_unit: gb
        aggregate_name: "{{ aggregate }}"
        space_guarantee: none
        junction_path: "/{{ item }}"
        volume_security_style: unix
      loop: "{{ volname }}"

    - name: Create Cifs share
      na_ontap_cifs:
        name: "{{ item }}"
        state: present
        path: "/{{ item }}"
      loop: "{{ volname }}"
      when: protocol.lower() == 'cifs'

  


        



        